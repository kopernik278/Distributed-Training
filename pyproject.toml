[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-distributed-training"
version = "0.1.0"
description = "Phase 1 of a mini distributed LLM training engine"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "pyarrow",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
